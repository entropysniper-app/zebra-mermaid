[package]
name = "zebra-mermaid-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command line renderer for Mermaid diagrams, built on the zebra-mermaid library"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["mermaid", "diagram", "svg", "cli", "renderer"]
categories = ["command-line-utilities", "graphics", "visualization"]
include = ["src/**", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]
publish = ["crates-io"]

[[bin]]
name = "zebra-mermaid"
path = "src/main.rs"

[features]
default = ["implemented"]
implemented = ["zebra-mermaid/implemented"]
all-diagrams = ["zebra-mermaid/all-diagrams"]
mvp = ["zebra-mermaid/mvp"]
standard = ["zebra-mermaid/standard"]

[dependencies]
zebra-mermaid = { version = "=0.1.0", path = "../zebra-mermaid", default-features = false, features = ["serde"] }
serde = { workspace = true }
serde_json.workspace = true

[dev-dependencies]
quick-xml.workspace = true

[lints.rust]
unsafe_code = "forbid"
