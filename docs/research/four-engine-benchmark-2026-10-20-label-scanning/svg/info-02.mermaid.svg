<svg id="bench49" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 400px;" role="graphics-document document" aria-roledescription="info"><style>#bench49{font-family:Arial;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#bench49 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#bench49 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#bench49 .error-icon{fill:#a44141;}#bench49 .error-text{fill:#ddd;stroke:#ddd;}#bench49 .edge-thickness-normal{stroke-width:1px;}#bench49 .edge-thickness-thick{stroke-width:3.5px;}#bench49 .edge-pattern-solid{stroke-dasharray:0;}#bench49 .edge-thickness-invisible{stroke-width:0;fill:none;}#bench49 .edge-pattern-dashed{stroke-dasharray:3;}#bench49 .edge-pattern-dotted{stroke-dasharray:2;}#bench49 .marker{fill:lightgrey;stroke:lightgrey;}#bench49 .marker.cross{stroke:lightgrey;}#bench49 svg{font-family:Arial;font-size:16px;}#bench49 p{margin:0;}#bench49 .node .neo-node{stroke:#ccc;}#bench49 [data-look="neo"].node rect,#bench49 [data-look="neo"].cluster rect,#bench49 [data-look="neo"].node polygon{stroke:url(#bench49-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench49 [data-look="neo"].swimlane.cluster rect{filter:none;}#bench49 [data-look="neo"].node path{stroke:url(#bench49-gradient);stroke-width:1px;}#bench49 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench49 [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#bench49 [data-look="neo"].node circle{stroke:url(#bench49-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench49 [data-look="neo"].node circle .state-start{fill:#000000;}#bench49 [data-look="neo"].icon-shape .icon{fill:url(#bench49-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench49 [data-look="neo"].icon-shape .icon-neo path{stroke:url(#bench49-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench49 :root{--mermaid-font-family:Arial;}</style><g/><g><text x="100" y="40" class="version" font-size="32" style="text-anchor: middle;">v12.1.0</text></g></svg>