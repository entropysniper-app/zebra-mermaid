<svg id="bench35" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 1216px;" viewBox="-30 -30 1216 330" role="graphics-document document" aria-roledescription="eventmodeling"><style>#bench35{font-family:Arial;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#bench35 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#bench35 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#bench35 .error-icon{fill:#a44141;}#bench35 .error-text{fill:#ddd;stroke:#ddd;}#bench35 .edge-thickness-normal{stroke-width:1px;}#bench35 .edge-thickness-thick{stroke-width:3.5px;}#bench35 .edge-pattern-solid{stroke-dasharray:0;}#bench35 .edge-thickness-invisible{stroke-width:0;fill:none;}#bench35 .edge-pattern-dashed{stroke-dasharray:3;}#bench35 .edge-pattern-dotted{stroke-dasharray:2;}#bench35 .marker{fill:lightgrey;stroke:lightgrey;}#bench35 .marker.cross{stroke:lightgrey;}#bench35 svg{font-family:Arial;font-size:16px;}#bench35 p{margin:0;}#bench35 .node .neo-node{stroke:#ccc;}#bench35 [data-look="neo"].node rect,#bench35 [data-look="neo"].cluster rect,#bench35 [data-look="neo"].node polygon{stroke:url(#bench35-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench35 [data-look="neo"].swimlane.cluster rect{filter:none;}#bench35 [data-look="neo"].node path{stroke:url(#bench35-gradient);stroke-width:1px;}#bench35 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench35 [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#bench35 [data-look="neo"].node circle{stroke:url(#bench35-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench35 [data-look="neo"].node circle .state-start{fill:#000000;}#bench35 [data-look="neo"].icon-