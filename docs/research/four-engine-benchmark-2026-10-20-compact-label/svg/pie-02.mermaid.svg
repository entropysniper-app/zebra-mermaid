<svg id="bench65" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 551.6875 450" style="max-width: 551.6875px;" role="graphics-document document" aria-roledescription="pie"><style>#bench65{font-family:Arial;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#bench65 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#bench65 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#bench65 .error-icon{fill:#a44141;}#bench65 .error-text{fill:#ddd;stroke:#ddd;}#bench65 .edge-thickness-normal{stroke-width:1px;}#bench65 .edge-thickness-thick{stroke-width:3.5px;}#bench65 .edge-pattern-solid{stroke-dasharray:0;}#bench65 .edge-thickness-invisible{stroke-width:0;fill:none;}#bench65 .edge-pattern-dashed{stroke-dasharray:3;}#bench65 .edge-pattern-dotted{stroke-dasharray:2;}#bench65 .marker{fill:lightgrey;stroke:lightgrey;}#bench65 .marker.cross{stroke:lightgrey;}#bench65 svg{font-family:Arial;font-size:16px;}#bench65 p{margin:0;}#bench65 .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#bench65 .pieCircle.highlighted{scale:1.05;opacity:1;}#bench65 .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#bench65 .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#bench65 .pieTitleText{text-anchor:middle;font-size:25px;fill:lightgrey;font-family:Arial;}#bench65 .slice{font-family:Arial;fill:#ccc;font-size:17px;}#bench65 .legend text{fill:lightgrey;font-family:Arial;font-size:17px;}#bench65 .node .neo-node{stroke:#ccc;}#bench65 [data-look="neo"].node rect,#bench65 [data-look="neo"].cluster rect,#bench65 [data-look="neo"].node polygon{stroke:url(#bench65-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench65 [data-look="neo"].swimlane.cluster rect{filter:none;}#bench65 [data-look="neo"].node path{stroke:url(#bench65-gradient);stroke-width:1px;}#bench65 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench65 [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#bench65 [data-look="neo"].node circle{stroke:url(#bench65-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench65 [data-look="neo"].node circle .state-start{fill:#000000;}#bench65 [data-look="neo"].icon-shape .icon{fill:url(#bench65-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench65 [data-look="neo"].icon-shape .icon-neo path{stroke:url(#bench65-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench65 :root{--mermaid-font-family:Arial;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,1,1,-177.899,-50.763L0,0Z" fill="#0b0000" class="pieCircle"/><path d="M-177.899,-50.763A185,185,0,0,1,-35.652,-181.532L0,0Z" fill="#4d1037" class="pieCircle"/><path d="M-35.652,-181.532A185,185,0,0,1,0,-185L0,0Z" fill="#3f5258" class="pieCircle"/><text transform="translate(83.57344705444068,110.75667676234512)" class="slice" style="text-anchor: middle;">79%</text><text transform="translate(-93.90333582091016,-102.14561185731559)" class="slice" style="text-anchor: middle;">17%</text><text transform="translate(-13.432508310066218,-138.09826291630174)" class="slice" style="text-anchor: middle;">3%</text></g><text x="0" y="-200" class="pieTitleText">Pets adopted by volunteers</text><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(11, 0, 0); stroke: rgb(11, 0, 0);"/><text x="22" y="14">Dogs</text></g><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(77, 16, 55); stroke: rgb(77, 16, 55);"/><text x="22" y="14">Cats</text></g><g class="legend" transform="translate(216,11)"><rect width="18" height="18" style="fill: rgb(63, 82, 88); stroke: rgb(63, 82, 88);"/><text x="22" y="14">Rats</text></g></g></svg>