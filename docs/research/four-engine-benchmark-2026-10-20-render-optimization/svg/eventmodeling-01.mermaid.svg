<svg id="bench30" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 904.6666870117188px;" viewBox="-30 -30 904.6666870117188 470" role="graphics-document document" aria-roledescription="eventmodeling"><style>#bench30{font-family:Arial;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#bench30 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#bench30 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#bench30 .error-icon{fill:#a44141;}#bench30 .error-text{fill:#ddd;stroke:#ddd;}#bench30 .edge-thickness-normal{stroke-width:1px;}#bench30 .edge-thickness-thick{stroke-width:3.5px;}#bench30 .edge-pattern-solid{stroke-dasharray:0;}#bench30 .edge-thickness-invisible{stroke-width:0;fill:none;}#bench30 .edge-pattern-dashed{stroke-dasharray:3;}#bench30 .edge-pattern-dotted{stroke-dasharray:2;}#bench30 .marker{fill:lightgrey;stroke:lightgrey;}#bench30 .marker.cross{stroke:lightgrey;}#bench30 svg{font-family:Arial;font-size:16px;}#bench30 p{margin:0;}#bench30 .node .neo-node{stroke:#ccc;}#bench30 [data-look="neo"].node rect,#bench30 [data-look="neo"].cluster rect,#bench30 [data-look="neo"].node polygon{stroke:url(#bench30-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench30 [data-look="neo"].swimlane.cluster rect{filter:none;}#bench30 [data-look="neo"].node path{stroke:url(#bench30-gradient);stroke-width:1px;}#bench30 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench30 [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#bench30 [data-look="neo"].node circle{stroke:url(#bench30-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench30 [data-look="neo"].node circle .state-start{fill:#000000;}#bench30 [data-look="neo"].icon-shape .icon{fill:url(#bench30-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench30 [data-look="neo"].icon-shape .icon-neo path{stroke:url(#bench30-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench30 :root{--mermaid-font-family:Arial;}</style><g/><g class="em-swimlane"><rect x="0" y="0" rx="3" width="844.6666666666667" height="130" fill="hsl(0, 0%, 25%)" stroke="hsl(0, 0%, 32%)"/><text font-weight="bold" x="30" y="30">UI/Automation</text></g><g class="em-swimlane"><rect x="0" y="140" rx="3" width="844.6666666666667" height="130" fill="hsl(0, 0%, 25%)" stroke="hsl(0, 0%, 32%)"/><text font-weight="bold" x="30" y="170">Command/Read Model</text></g><g class="em-swimlane"><rect x="0" y="280" rx="3" width="844.6666666666667" height="130" fill="hsl(0, 0%, 25%)" stroke="hsl(0, 0%, 32%)"/><text font-weight="bold" x="30" y="310">Events</text></g><g class="em-box"><rect x="250" y="15" rx="3" width="149" height="100" stroke="#555" fill="#2d2d2d"/><foreignObject x="260" y="25" width="129" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text-align: center; vertical-align: middle;"><b>CartUI</b></span></div></foreignObject></g><g class="em-box"><rect x="329" y="155" rx="3" width="280.33333333333337" height="100" stroke="#5c6d8c" fill="hsl(218.6666666667, 33.3333333333%, 36.4705882353%)"/><foreignObject x="339" y="165" width="260.33333333333337" height="80"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; height: 100%; width: 100%;"><span style="display: table-cell; text-align: center; vertical-align: middle;"><b>AddItem</b><br /><br /><code style="text-align: left; display: block;max-width:430px">description: string</code></span></div></foreignObject></g><g class="em-box"><rect x="539.3333333333334" y="295" rx="3" width="280.33333333333337" height="100" stroke="#8c755c" fill="hsl(32, 33.3333333333%, 36.47058823