<svg id="bench68" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 400px;" viewBox="0 0 400 400" role="graphics-document document" aria-roledescription="quadrantChart"><style>#bench68{font-family:Arial;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#bench68 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#bench68 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#bench68 .error-icon{fill:#a44141;}#bench68 .error-text{fill:#ddd;stroke:#ddd;}#bench68 .edge-thickness-normal{stroke-width:1px;}#bench68 .edge-thickness-thick{stroke-width:3.5px;}#bench68 .edge-pattern-solid{stroke-dasharray:0;}#bench68 .edge-thickness-invisible{stroke-width:0;fill:none;}#bench68 .edge-pattern-dashed{stroke-dasharray:3;}#bench68 .edge-pattern-dotted{stroke-dasharray:2;}#bench68 .marker{fill:lightgrey;stroke:lightgrey;}#bench68 .marker.cross{stroke:lightgrey;}#bench68 svg{font-family:Arial;font-size:16px;}#bench68 p{margin:0;}#bench68 .node .neo-node{stroke:#ccc;}#bench68 [data-look="neo"].node rect,#bench68 [data-look="neo"].cluster rect,#bench68 [data-look="neo"].node polygon{stroke:url(#bench68-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench68 [data-look="neo"].swimlane.cluster rect{filter:none;}#bench68 [data-look="neo"].node path{stroke:url(#bench68-gradient);stroke-width:1px;}#bench68 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench68 [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#bench68 [data-look="neo"].node circle{stroke:url(#bench68-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench68 [data-look="neo"].node circle .state-start{fill:#000000;}#bench68 [data-look="neo"].icon-shape 