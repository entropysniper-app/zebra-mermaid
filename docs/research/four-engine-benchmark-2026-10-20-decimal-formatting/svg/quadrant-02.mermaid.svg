"middle" transform="translate(122, 5) rotate(0)">Urgent</text></g><g class="label"><text x="0" y="0" fill="#e0dfdf" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(304, 5) rotate(0)">Not Urgent</text></g><g class="label"><text x="0" y="0" fill="#e0dfdf" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 304) rotate(-90)">Not Important</text></g><g class="label"><text x="0" y="0" fill="#e0dfdf" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 122) rotate(-90)">Important ❤</text></g></g><g class="title"/></g></svg>