<svg xmlns="http://www.w3.org/2000/svg" width="660" height="446.8" viewBox="0 0 660 446.8"><rect x="0" y="0" width="660" height="446.8" fill="#333333"/><defs><marker id="arrow-0" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="lightgrey" stroke="lightgrey" stroke-width="1" stroke-dasharray="1,0"/></marker><marker id="arrow-start-0" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" fill="lightgrey" stroke="lightgrey" stroke-width="1" stroke-dasharray="1,0"/></marker></defs><rect x="0" y="0" width="660.00" height="446.80" fill="#333333"/><text x="330.00" y="50.00" text-anchor="middle" font-family="Arial" font-size="16" fill="#e0dfdf"><tspan x="330.00" dy="0.00">England&apos;s History Timeline</tspan></text><text x="273.32" y="86.00" text-anchor="middle" font-family="Arial" font-size="16" fill="#e0dfdf" font-weight="bold"><tspan x="273.32" dy="0.00">Stone Age</tspan></text><text x="382.01" y="86.00" text-anchor="middle" font-family="Arial" font-size="16" fill="#e0dfdf" font-weight="bold"><tspan x="382.01" dy="0.00">Bronze Age</tspan></text><line x1="30.00" y1="174.00" x2="630.00" y2="174.00" stroke="#cccccc" stroke-width="3"/><circle cx="90.00" cy="174.00" r="8" fill="#1f2020" stroke="#cccccc" stroke-width="2"/><line x1="90.00" y1="182.00" x2="90.00" y2="204.00" stroke="#cccccc" stroke-width="2" stroke-dasharray="4,2"/><rect x="30.00" y="204.00" width="120.00" height="138.00" rx="5" ry="5" fill="#ECECFF" stroke="#cccccc" stroke-width="1"/><text x="90.00" y="224.00" text-anchor="middle" font-family="Arial" font-size="16" fill="#e0dfdf" font-weight="bold"><tspan x="90.00" dy="0.00">7600 BC</tspan></text><text x="90.00" y="244.00" text-anchor="middle" font-family="Arial" font-size="14.4" fill="#e0dfdf"><tspan x="90.00" dy="0.00">Britain&apos;s oldest</tspan><tspan x="90.00" dy="21.60">known house</tspan><tspan x="90.00" dy="21.60">was built in</tspan><tspan x="90.00" dy="21.60">Orkney,</tspan><tspan x="90.00" dy="21.60">Scotland</tspan></text><circle cx="250.00" cy="174.00" r="8" fill="#1f2020" stroke="#cccccc" stroke-width="2"/><line x1="250.00" y1="182.00" x2="250.00" y2="204.00" stroke="#cccccc" stroke-width="2" stroke-dasharray="4,2"/><rect x="190.00" y="204.00" width="120.00" height="202.80" rx="5" ry="5" fill="#FFE6CC" stroke="#cccccc" stroke-width="1"/><text x="250.00" y="224.00" text-anchor="middle" font-family="Arial" font-size="16" fill="#e0dfdf" font-weight="bold"><tspan x="250.00" dy="0.00">6000 BC</tspan></text><text x="250.00" y="244.00" text-anchor="middle" font-family="Arial" font-size="14.4" fill="#e0dfdf"><tspan x="250.00" dy="0.00">Sea levels rise</tspan><tspan x="250.00" dy="21.60">and Britain</tspan><tspan x="250.00" dy="21.60">becomes an</tspan><tspan x="250.00" dy="21.60">island.</tspan><tspan x="250.00" dy="21.60">The people who</tspan><tspan x="250.00" dy="21.60">live here are</tspan><tspan x="250.00" dy="21.60">hunter-gatherer</tspan><tspan x="250.00" dy="21.60">s.</tspan></text><circle cx="410.00" cy="174.00" r="8" fill="#1f2020" stroke="#cccccc" stroke-width="2"/><line x1="410.00" y1="182.00" x2="410.00" y2="204.00" stroke="#cccccc" stroke-width="2" stroke-dasharray="4,2"/><rect x="350.00" y="204.00" width="120.00" height="181.20" rx="5" ry="5" fill="#D5E8D4" stroke="#cccccc" stroke-width="1"/><text x="410.00" y="224.00" text-anchor="middle" font-family="Arial" font-size="16" fill="#e0dfdf" font-weight="bold"><tspan x="410.00" dy="0.00">2300 BC</tspan></text><text x="410.00" y="244.00" text-anchor="middle" font-family="Arial" font-size="14.4" fill="#e0dfdf"><tspan x="410.00" dy="0.00">People arrive</tspan><tspan x="410.00" dy="21.60">from Europe</tspan><tspan x="410.00" dy="21.60">and settle in</tspan><tspan x="410.00" dy="21.60">Britain.</tspan><tspan x="410.00" dy="21.60">They bring</tspan><tspan x="410.00" dy="21.60">farming and</tspan><tspan x="410.00" dy="21.60">metalworking.</tspan></text><circle cx="570.00" cy="174.00" r="8" fill="#1f2020" stroke="#cccccc" stroke-width="2"/><line x1="570.00" y1="182.00" x2="570.00" y2="204.00" stroke="#cccccc" stroke-width="2" stroke-dasharray="4,2"/><rect x="510.00" y="204.00" width="120.00" height="181.20" rx="5" ry="5" fill="#F8CECC" stroke="#cccccc" stroke-width="1"/><text x="570.00" y="224.00" text-anchor="middle" font-family="Arial" font-size="16" fill="#e0dfdf" font-weight="bold"><tspan x="570.00" dy="0.00">2200 BC</tspan></text><text x="570.00" y="244.00" text-anchor="middle" font-family="Arial" font-size="14.4" fill="#e0dfdf"><tspan x="570.00" dy="0.00">The last major</tspan><tspan x="570.00" dy="21.60">building works</tspan><tspan x="570.00" dy="21.60">are completed</tspan><tspan x="570.00" dy="21.60">at Stonehenge.</tspan><tspan x="570.00" dy="21.60">People now</tspan><tspan x="570.00" dy="21.60">bury their dead</tspan><tspan x="570.00" dy="21.60">in stone circles.</tspan></text></svg>