<svg id="bench61" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1026 188" style="max-width: 1026px;" role="graphics-document document" aria-roledescription="packet"><style>#bench61{font-family:Arial;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#bench61 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#bench61 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#bench61 .error-icon{fill:#a44141;}#bench61 .error-text{fill:#ddd;stroke:#ddd;}#bench61 .edge-thickness-normal{stroke-width:1px;}#bench61 .edge-thickness-thick{stroke-width:3.5px;}#bench61 .edge-pattern-solid{stroke-dasharray:0;}#bench61 .edge-thickness-invisible{stroke-width:0;fill:none;}#bench61 .edge-pattern-dashed{stroke-dasharray:3;}#bench61 .edge-pattern-dotted{stroke-dasharray:2;}#bench61 .marker{fill:lightgrey;stroke:lightgrey;}#bench61 .marker.cross{stroke:lightgrey;}#bench61 svg{font-family:Arial;font-size:16px;}#bench61 p{margin:0;}#bench61 .packetByte{font-size:10px;}#bench61 .packetByte.start{fill:#e0dfdf;}#bench61 .packetByte.end{fill:#e0dfdf;}#bench61 .packetLabel{fill:#e0dfdf;font-size:12px;}#bench61 .packetTitle{fill:#e0dfdf;font-size:14px;}#bench61 .packetBlock{stroke:#e0dfdf;stroke-width:1;fill:#333;}#bench61 .node .neo-node{stroke:#ccc;}#bench61 [data-look="neo"].node rect,#bench61 [data-look="neo"].cluster rect,#bench61 [data-look="neo"].node polygon{stroke:url(#bench61-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench61 [data-look="neo"].swimlane.cluster rect{filter:none;}#bench61 [data-look="neo"].node path{stroke:url(#bench61-gradient);stroke-width:1px;}#bench61 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench61 [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#bench61 [data-look="neo"].node circle{stroke:url(#bench61-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench61 [data-look="neo"].node circle .state-start{fill:#000000;}#bench61 [data-look="neo"].icon-shape .icon{fill:url(#bench61-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench61 [data-look="neo"].icon-shape .icon-neo path{stroke:url(#bench61-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#bench61 :root{--mermaid-font-family:Arial;}</style><g/><g><rect x="1" y="15" width="507" height="32" class="packetBlock"/><text x="254.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Source Port</text><text x="1" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">0</text><text x="508" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">15</text><rect x="513" y="15" width="507" height="32" class="packetBlock"/><text x="766.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Destination Port</text><text x="513" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">16</text><text x="1020" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">31</text></g><g><rect x="1" y="62" width="507" height="32" class="packetBlock"/><text x="254.5" y="78" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Length</text><text x="1" y="60" class="packetByte start" dominant-baseline="auto" text-anchor="start">32</text><text x="508" y="60" class="packetByte end" dominant-baseline="auto" text-anchor="end">47</text><rect x="513" y="62" width="507" height="32" class="packetBlock"/><text x="766.5" y="78" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Checksum</text><text x="513" y="60" class="packetByte start" dominant-baseline="auto" text-anchor="start">48</text><text x="1020" y="60" class="packetByte end" dominant-baseline="auto" text-anchor="end">63</text></g><g><rect x="1" y="109" width="1019" height="32" class="packetBlock"/><text x="510.5" y="125" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Data (variable length)</text><text x="1" y="107" class="packetByte start" dominant-baseline="auto" text-anchor="start">64</text><text x="1020" y="107" class="packetByte end" dominant-baseline="auto" text-anchor="end">95</text></g><text x="513" y="164.5" dominant-baseline="middle" text-anchor="middle" class="packetTitle">UDP Packet</text></svg>