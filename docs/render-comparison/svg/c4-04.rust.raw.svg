middle">[Relational Database Schema]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="18.05">Stores user registration</tspan><tspan x="0" y="35.05">information, hashed</tspan><tspan x="0" y="52.05">authentication credentials,</tspan><tspan x="0" y="69.05">access logs, etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-external_system pele-c4-external" data-id="mbs" transform="translate(384,337)"><rect x="-108" y="-91" width="216" height="182" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-44.3" text-anchor="middle">«external system»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-23.4">Mainframe Banking</tspan><tspan x="0" y="-2.4">System</tspan></text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="19.55">Stores all of the core banking</tspan><tspan x="0" y="36.55">information about customers,</tspan><tspan x="0" y="53.55">accounts, transactions, etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-component" data-id="sign" transform="translate(120,635.5)"><rect x="-108" y="-79.5" width="216" height="159" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-36.8" text-anchor="middle">«component»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-14.4">Sign In Controller</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="6.55" text-anchor="middle">[MVC Rest Controller]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="29.05">Allows users to sign in to the</tspan><tspan x="0" y="46.05">internet banking system</tspan></text></g><g class="p