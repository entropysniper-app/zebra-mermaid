er:none;}#mermaid-62 [data-look="neo"].node path{stroke:url(#mermaid-62-gradient);stroke-width:1px;}#mermaid-62 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-62 [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#mermaid-62 [data-look="neo"].node circle{stroke:url(#mermaid-62-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-62 [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-62 [data-look="neo"].icon-shape .icon{fill:url(#mermaid-62-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-62 [data-look="neo"].icon-shape .icon-neo path{stroke:url(#mermaid-62-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-62 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g><rect x="257" y="15" width="251" height="32" class="packetBlock"/><text x="382.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">DATA</text><text x="257" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">7</text><text x="508" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">0</text><rect x="129" y="15" width="123" height="32" class="packetBlock"/><text x="190.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">TYPE</text><text x="129" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">11</text><text x="252" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">8</text><rect x="97" y="15" width="27" height="32" class="packetBlock"/><text x="110.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">EN</text><text x="110.5" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="middle">12</text><rect x="1" y="15" width="91" height="32" class="packetBlock"/><text x="46.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">RESERVED</