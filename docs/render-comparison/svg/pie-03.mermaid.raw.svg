<svg id="mermaid-66" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 654.734375 450" style="max-width: 654.734375px;" role="graphics-document document" aria-roledescription="pie"><style>#mermaid-66{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-66 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-66 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-66 .error-icon{fill:#a44141;}#mermaid-66 .error-text{fill:#ddd;stroke:#ddd;}#mermaid-66 .edge-thickness-normal{stroke-width:1px;}#mermaid-66 .edge-thickness-thick{stroke-width:3.5px;}#mermaid-66 .edge-pattern-solid{stroke-dasharray:0;}#mermaid-66 .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-66 .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-66 .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-66 .marker{fill:lightgrey;stroke:lightgrey;}#mermaid-66 .marker.cross{stroke:lightgrey;}#mermaid-66 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-66 p{margin:0;}#mermaid-66 .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#mermaid-66 .pieCircle.highlighted{scale:1.05;opacity:1;}#mermaid-66 .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#mermaid-66 .pieOuterCircle{stroke:black;stroke-width:5px;fill:none;}#mermaid-66 .pieTitleText{text-anchor:middle;font-size:25px;fill:lightgrey;font-family:"trebuchet ms",verdana,arial,sans-serif;}#mermaid-66 .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#ccc;font-size:17px;}#mermaid-66 .legend text{fill:lightgrey;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#mermaid-66 .node .neo-node{stroke:#ccc;}#mermaid-66 [data-look="neo"].node rect,#mer