<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-timeline" viewBox="0 0 800 371" width="800" height="371" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,ui-monospace, SFMono-Regular, &quot;Cascadia Code&quot;, &quot;IBM Plex Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,-apple-system, BlinkMacSystemFont, &quot;Inter Variable&quot;, Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="timeline"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="400" y="25.6">Hawaiʻi's History Timeline</tspan></text><path class="pele-axis" d="M8,156H785" fill="none" stroke="var(--_l)"/><path class="pele-marker" d="M792,156L784,159.36L784,152.64Z" fill="var(--_l)" stroke="none"/><g class="pele-cluster pele-section" data-id="Voyagers"><rect x="8" y="48" width="372" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="194" y="73.6">Voyagers</tspan></text><g class="pele-node pele-period" data-id="1000 AD"><rect x="8" y="96" width="176" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="96" y="121.6" text-anchor="middle">1000 AD</text><path class="pele-edge" d="M96,136V176" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="96" cy="156" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="8" y="176" width="176" height="79" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="96" y="199.4">Polynesian voyagers</tspan><tspan x="96" y="220.4">reach Hawaiʻi in sailing</tspan><tspan x="96" y="241.4">canoes</tspan></text></g></g><g class="pele-node pele-period" data-id="1778"><rect x="204" y="96" width="176" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="292" y="121.6" text-anchor="middle">1778</text><path class="pele-edge" d="M292,136V176" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="292" cy="156" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="204" y="176" width="176" height="121" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="292" y="199.4">Captain Cook lands on</tspan><tspan x="292" y="220.4">Kauaʻi.</tspan><tspan x="292" y="241.4">Islanders and</tspan><tspan x="292" y="262.4">Europeans meet for the</tspan><tspan x="292" y="283.4">first time.</tspan></text></g></g></g><g class="pele-cluster pele-section" data-id="Kingdom"><rect x="400" y="48" width="372" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="586" y="73.6">Kingdom</tspan></text><g class="pele-node pele-period" data-id="1810"><rect x="400" y="96" width="176" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="488" y="121.6" text-anchor="middle">1810</text><path class="pele-edge" d="M488,136V176M488,297V305" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="488" cy="156" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="400" y="176" width="176" height="121" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="488" y="199.4">King Kamehameha</tspan><tspan x="488" y="220.4">unites the islands.</tspan><tspan x="488" y="241.4">They are ruled as one</tspan><tspan x="488" y="262.4">kingdom for the first</tspan><tspan x="488" y="283.4">time.</tspan></text></g><g class="pele-node pele-event"><rect x="400" y="305" width="176" height="58" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="488" y="328.4">Ships from around the</tspan><tspan x="488" y="349.4">world stop to trade.</tspan></text></g></g><g class="pele-node pele-period" data-id="1882"><rect x="596" y="96" width="176" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="684" y="121.6" text-anchor="middle">1882</text><path class="pele-edge" d="M684,136V176M684,276V284" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="684" cy="156" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="596" y="176" width="176" height="100" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="684" y="199.4">ʻIolani Palace is</tspan><tspan x="684" y="220.4">completed in Honolulu.</tspan><tspan x="684" y="241.4">It soon has electric</tspan><tspan x="684" y="262.4">lights and telephones.</tspan></text></g><g class="pele-node pele-event"><rect x="596" y="284" width="176" height="79" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="684" y="307.4">Most people in the</tspan><tspan x="684" y="328.4">kingdom can read and</tspan><tspan x="684" y="349.4">write.</tspan></text></g></g></g></svg>