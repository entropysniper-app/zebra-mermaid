<svg id="mermaid-48" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 400px;" role="graphics-document document" aria-roledescription="info"><style>#mermaid-48{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-48 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-48 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-48 .error-icon{fill:#a44141;}#mermaid-48 .error-text{fill:#ddd;stroke:#ddd;}#mermaid-48 .edge-thickness-normal{stroke-width:1px;}#mermaid-48 .edge-thickness-thick{stroke-width:3.5px;}#mermaid-48 .edge-pattern-solid{stroke-dasharray:0;}#mermaid-48 .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-48 .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-48 .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-48 .marker{fill:lightgrey;stroke:lightgrey;}#mermaid-48 .marker.cross{stroke:lightgrey;}#mermaid-48 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-48 p{margin:0;}#mermaid-48 .node .neo-node{stroke:#ccc;}#mermaid-48 [data-look="neo"].node rect,#mermaid-48 [data-look="neo"].cluster rect,#mermaid-48 [data-look="neo"].node polygon{stroke:url(#mermaid-48-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-48 [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-48 [data-look="neo"].node path{stroke:url(#mermaid-48-gradient);stroke-width:1px;}#mermaid-48 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-48 [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#mermaid-48 [data-look="neo"].node circle{stroke:url(#mermaid-48-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-48 [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-48 [data-look="neo"].icon-shape .icon{fill:url(#mermaid-48-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-48 [data-look="neo"].icon-shape .icon-neo path{stroke:url(#mermaid-48-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-48 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g><text x="100" y="40" class="version" font-size="32" style="text-anchor: middle;">v12.1.0</text></g></svg>