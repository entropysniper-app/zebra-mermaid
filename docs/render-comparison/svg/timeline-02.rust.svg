<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-timeline" viewBox="0 0 800 350" width="800" height="350" style="max-width: 100%; height: auto; --_bg: var(--pele-bg,#fff); --_fg: var(--pele-fg,#1f1f1f); --_m: var(--pele-muted,#6e6e6e); --_l: var(--pele-line,#1f1f1f); --_s: var(--pele-surface,#f3f3f3); --_a: var(--pele-surface-alt,#e6e6e6); --_b: var(--pele-border,#8a8a8a); --_c: var(--pele-accent,#5b7bd5); color: var(--_fg); --_r: var(--pele-radius,4px); --_tw: var(--pele-title-weight,bold); --_hw: var(--pele-heading-weight,bold); --_fm: var(--pele-font-mono,ui-monospace, SFMono-Regular, &quot;Cascadia Code&quot;, &quot;IBM Plex Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace); font-style: normal; font-variant: normal; font-size-adjust: none; font-language-override: normal; font-kerning: auto; font-optical-sizing: auto; font-feature-settings: normal; font-variation-settings: normal; font-weight: normal; font-stretch: normal; font-size: 16px; line-height: normal; letter-spacing: normal; word-spacing: normal; text-transform: none; direction: ltr; font-family: var(--pele-font,-apple-system, BlinkMacSystemFont, &quot;Inter Variable&quot;, Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif); --pele-critical: #d14d41; --pele-series-3: #d0a215; --pele-surface: #282726; --pele-border: #403e3c; --pele-series-1: #d14d41; --pele-muted: #878580; --pele-series-5: #3aa99f; --pele-font: -apple-system, BlinkMacSystemFont, &quot;Inter Variable&quot;, Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; --pele-font-mono: ui-monospace, SFMono-Regular, &quot;Cascadia Code&quot;, &quot;IBM Plex Mono&quot;, &quot;Roboto Mono&quot;, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, Menlo, Monaco, &quot;Consolas&quot;, &quot;Source Code Pro&quot;, monospace; --pele-accent: #4385be; --pele-series-8: #ce5d97; --pele-series-4: #879a39; --pele-radius: 6px; --pele-surface-alt: #343331; --pele-series-6: #4385be; --pele-fg: #cecdc3; --pele-series-2: #da702c; --pele-line: #cecdc3; --pele-series-7: #8b7ec8; --pele-bg: #1c1b1a; background-color: rgb(28, 27, 26); text-rendering: optimizelegibility; -webkit-font-smoothing: antialiased;" fill="var(--_fg)" role="graphics-document document" aria-roledescription="timeline" data-pele-theme="dark"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="400" y="25.6">Hawaiʻi's History Timeline</tspan></text><path class="pele-axis" d="M8,156H785" fill="none" stroke="var(--_l)"/><path class="pele-marker" d="M792,156L784,159.36L784,152.64Z" fill="var(--_l)" stroke="none"/><g class="pele-cluster pele-section" data-id="Voyagers"><rect x="8" y="48" width="372" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="194" y="73.6">Voyagers</tspan></text><g class="pele-node pele-period" data-id="1000 AD"><rect x="8" y="96" width="176" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="96" y="121.6" text-anchor="middle">1000 AD</text><path class="pele-edge" d="M96,136V176" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="96" cy="156" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="8" y="176" width="176" height="70" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="96" y="197.9">Polynesian voyagers</tspan><tspan x="96" y="215.9">reach Hawaiʻi in sailing</tspan><tspan x="96" y="233.9">canoes</tspan></text></g></g><g class="pele-node pele-period" data-id="1778"><rect x="204" y="96" width="176" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="292" y="121.6" text-anchor="middle">1778</text><path class="pele-edge" d="M292,136V176" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="292" cy="156" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="204" y="176" width="176" height="106" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="292" y="197.9">Captain Cook lands on</tspan><tspan x="292" y="215.9">Kauaʻi.</tspan><tspan x="292" y="233.9">Islanders and</tspan><tspan x="292" y="251.9">Europeans meet for the</tspan><tspan x="292" y="269.9">first time.</tspan></text></g></g></g><g class="pele-cluster pele-section" data-id="Kingdom"><rect x="400" y="48" width="372" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="586" y="73.6">Kingdom</tspan></text><g class="pele-node pele-period" data-id="1810"><rect x="400" y="96" width="176" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="488" y="121.6" text-anchor="middle">1810</text><path class="pele-edge" d="M488,136V176M488,282V290" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="488" cy="156" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="400" y="176" width="176" height="106" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="488" y="197.9">King Kamehameha</tspan><tspan x="488" y="215.9">unites the islands.</tspan><tspan x="488" y="233.9">They are ruled as one</tspan><tspan x="488" y="251.9">kingdom for the first</tspan><tspan x="488" y="269.9">time.</tspan></text></g><g class="pele-node pele-event"><rect x="400" y="290" width="176" height="52" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="488" y="311.9">Ships from around the</tspan><tspan x="488" y="329.9">world stop to trade.</tspan></text></g></g><g class="pele-node pele-period" data-id="1882"><rect x="596" y="96" width="176" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="684" y="121.6" text-anchor="middle">1882</text><path class="pele-edge" d="M684,136V176M684,264V272" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="684" cy="156" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="596" y="176" width="176" height="88" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="684" y="197.9">ʻIolani Palace is</tspan><tspan x="684" y="215.9">completed in Honolulu.</tspan><tspan x="684" y="233.9">It soon has electric</tspan><tspan x="684" y="251.9">lights and telephones.</tspan></text></g><g class="pele-node pele-event"><rect x="596" y="272" width="176" height="70" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="684" y="293.9">Most people in the</tspan><tspan x="684" y="311.9">kingdom can read and</tspan><tspan x="684" y="329.9">write.</tspan></text></g></g></g></svg>