<svg id="mermaid-120" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 880px;" viewBox="0 0 880 680" role="graphics-document document" aria-roledescription="cynefin"><style>#mermaid-120{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-120 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-120 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-120 .error-icon{fill:#a44141;}#mermaid-120 .error-text{fill:#ddd;stroke:#ddd;}#mermaid-120 .edge-thickness-normal{stroke-width:1px;}#mermaid-120 .edge-thickness-thick{stroke-width:3.5px;}#mermaid-120 .edge-pattern-solid{stroke-dasharray:0;}#mermaid-120 .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-120 .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-120 .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-120 .marker{fill:lightgrey;stroke:lightgrey;}#mermaid-120 .marker.cross{stroke:lightgrey;}#mermaid-120 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-120 p{margin:0;}#mermaid-120 .cynefinDomain{stroke:none;}#mermaid-120 .cynefinDomainLabel{font-size:16px;font-weight:bold;fill:#e0dfdf;}#mermaid-120 .cynefinSubtitle{font-size:11px;fill:#ccc;font-style:italic;}#mermaid-120 .cynefinItem{fill-opacity:0.95;stroke:lightgrey;stroke-width:1;}#mermaid-120 .cynefinItemText{font-size:12px;fill:#ccc;}#mermaid-120 .cynefinItemOverflow{fill-opacity:0.6;stroke:lightgrey;stroke-width:1;stroke-dasharray:3 2;}#mermaid-120 .cynefinBoundary{stroke:lightgrey;stroke-width:2;stroke-dasharray:6 3;}#mermaid-120 .cynefinCliff{stroke:#FF6B6B;stroke-width:4;}#mermaid-120 .cynefinConfusion{stroke:lightgrey;stroke-width:1.5;stroke-dasharray:4 2;}#mermaid-120 .cynefinArrowLine{stroke:lightgrey;stroke-width:2;fill:none;}#mermaid-120 .cynefinArrowHead{fill:lightgrey;stroke:none;}#mermaid-120 .cynefinArrowLabel{font-size:11px;fill:#ccc;}#mermaid-120 .cynefinTitle{font-size:18px;font-weight:bold;fill:#e0dfdf;}#mermaid-120 .node .neo-node{stroke:#ccc;}#mermaid-120 [data-look="neo"].node rect,#mermaid-120 [data-look="neo"].cluster rect,#mermaid-120 [data-look="neo"].node polygon{stroke:url(#mermaid-120-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-120 [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-120 [data-look="neo"].node path{stroke:url(#mermaid-120-gradient);stroke-width:1px;}#mermaid-120 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-120 [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#mermaid-120 [data-look="neo"].node circle{stroke:url(#mermaid-120-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-120 [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-120 [data-look="neo"].icon-shape .icon{fill:url(#mermaid-120-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-120 [data-look="neo"].icon-shape .icon-neo path{stroke:url(#mermaid-120-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-120 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(40, 40)"><g class="cynefin-backgrounds"><rect class="cynefinDomain" x="0" y="0" width="400" height="300" fill="#1B5E20" fill-opacity="0.4" stroke="none"></rect><rect class="cynefinDomain" x="400" y="0" width="400" height="300" fill="#0D47A1" fill-opacity="0.4" stroke="none"></rect><rect class="cynefinDomain" x="0" y="300" width="400" height="300" fill="#BF360C" fill-opacity="0.4" stroke="none"></rect><rect class="cynefinDomain" x="400" y="300" width="400" height="300" fill="#F57F17" fill-opacity="0.4" stroke="none"></rect></g><g class="cynefin-boundaries"><path class="cyn