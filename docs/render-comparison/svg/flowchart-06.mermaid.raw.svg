<svg id="mermaid-5" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 936px;" viewBox="4 4 936 64" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#mermaid-5{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-5 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-5 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-5 .error-icon{fill:#a44141;}#mermaid-5 .error-text{fill:#ddd;stroke:#ddd;}#mermaid-5 .edge-thickness-normal{stroke-width:1px;}#mermaid-5 .edge-thickness-thick{stroke-width:3.5px;}#mermaid-5 .edge-pattern-solid{stroke-dasharray:0;}#mermaid-5 .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-5 .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-5 .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-5 .marker{fill:lightgrey;stroke:lightgrey;}#mermaid-5 .marker.cross{stroke:lightgrey;}#mermaid-5 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-5 p{margin:0;}#mermaid-5 .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#ccc;}#mermaid-5 .cluster-label text{fill:#F9FFFE;}#mermaid-5 .cluster-label span{color:#F9FFFE;}#mermaid-5 .cluster-label span p{background-color:transparent;}#mermaid-5 .label text,#mermaid-5 span{fill:#ccc;color:#ccc;}#mermaid-5 .node rect,#mermaid-5 .node circle,#mermaid-5 .node ellipse,#mermaid-5 .node polygon,#mermaid-5 .node path{fill:#1f2020;stroke:#ccc;stroke-width:1px;}#mermaid-5 .rough-node .label text,#mermaid-5 .node .label text,#mermaid-5 .image-shape .label,#mermaid-5 .icon-shape .label{text-anchor:middle;}#mermaid-5 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#mermaid-5 .rough-node .label,#mermaid-5 .node .label,#mermaid-5 .image-shape .label,#mermaid-5 .icon-shape .label{text-align:center;}#mermaid-5 .node.clickable{cursor:pointer;}#mermaid-5 .root .anchor path{fill:lightgrey!important;stroke-width:0;stroke:lightgrey;}#mermaid-5 .arrowheadPath{fill:lightgrey;}#mermaid-5 .edgePaths .path{stroke:lightgrey;stroke-width:1px;}#mermaid-5 .flowchart-link{stroke:lightgrey;fill:none;}#mermaid-5 .edgeLabel{background-color:hsl(0, 0%, 34.4117647059%);text-align:center;}#mermaid-5 .edgeLabel p{background-color:hsl(0, 0%, 34.4117647059%);}#mermaid-5 .edgeLabel rect{opacity:0.5;background-color:hsl(0, 0%, 34.4117647059%);fill:hsl(0, 0%, 34.4117647059%);}#mermaid-5 .labelBkg{background-color:rgba(87.75, 87.75, 87.75, 0.5);}#mermaid-5 .cluster rect{fill:hsl(180, 1.5873015873%, 28.3529411765%);stroke:rgba(255, 255, 255, 0.25);stroke-width:1px;}#mermaid-5 .cluster text{fill:#F9FFFE;}#mermaid-5 .cluster span{color:#F9FFFE;}#mermaid-5 .node .collapsed-indicator{fill:rgba(255, 255, 255, 0.25);stroke:none;opacity:0.6;}#mermaid-5 .node .collapsed-separator{stroke:rgba(255, 255, 255, 0.25);stroke-width:0.75px;}#mermaid-5 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(20, 1.5873015873%, 12.3529411765%);border:1px solid rgba(255, 255, 255, 0.25);border-radius:2px;pointer-events:none;z-index:100;}#mermaid-5 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#ccc;}#mermaid-5 rect.text{fill:none;stroke-width:0;}#mermaid-5 .icon-shape,#mermaid-5 .image-shape{background-color:hsl(0, 0%, 34.4117647059%);text-align:center;}#mermaid-5 .icon-shape p,#mermaid-5 .image-shape p{background-color:hsl(0, 0%, 34.4117647059%);padding:2px;}#mermaid-5 .icon-shape .label rect,#mermaid-5 .image-shape .label rect{opacity:0.5;background-color:hsl(0, 0%, 34.4117647059%);fill:hsl(0, 0%, 34.4117647059%);}#mermaid-5 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-