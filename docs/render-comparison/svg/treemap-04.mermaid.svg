<svg id="mermaid-140" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="-190 -165 1380 755" style="max-width: 1380px; background-color: rgb(28, 27, 26); text-rendering: optimizelegibility; -webkit-font-smoothing: antialiased;" class="flowchart" role="graphics-document document" aria-roledescription="treemap"><style>#mermaid-140{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-140 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-140 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-140 .error-icon{fill:#a44141;}#mermaid-140 .error-text{fill:#ddd;stroke:#ddd;}#mermaid-140 .edge-thickness-normal{stroke-width:1px;}#mermaid-140 .edge-thickness-thick{stroke-width:3.5px;}#mermaid-140 .edge-pattern-solid{stroke-dasharray:0;}#mermaid-140 .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-140 .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-140 .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-140 .marker{fill:lightgrey;stroke:lightgrey;}#mermaid-140 .marker.cross{stroke:lightgrey;}#mermaid-140 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-140 p{margin:0;}#mermaid-140 .treemapNode.section{stroke:black;stroke-width:1;fill:#efefef;}#mermaid-140 .treemapNode.leaf{stroke:black;stroke-width:1;fill:#efefef;}#mermaid-140 .treemapLabel{fill:#ccc;font-size:12px;}#mermaid-140 .treemapValue{fill:#ccc;font-size:10px;}#mermaid-140 .treemapTitle{fill:#F9FFFE;font-size:14px;}#mermaid-140 .node .neo-node{stroke:#ccc;}#mermaid-140 [data-look="neo"].node rect,#mermaid-140 [data-look="neo"].cluster rect,#mermaid-140 [data-look="neo"].node polygon{stroke:url(#mermaid-140-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-140 [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-140 [data-look="neo"].node path{stroke:url(#mermaid-140-gradient);stroke-width:1px;}#mermaid-140 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-140 [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#mermaid-140 [data-look="neo"].node circle{stroke:url(#mermaid-140-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-140 [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-140 [data-look="neo"].icon-shape .icon{fill:url(#mermaid-140-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-140 [data-look="neo"].icon-shape .icon-neo path{stroke:url(#mermaid-140-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-140 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(0, 0)" class="treemapContainer"><g class="treemapSection" transform="translate(0,0)"><rect width="1000" height="25" class="treemapSectionHeader" fill="none" fill-opacity="0.6" stroke-width="0.6" style="display: none;"/><clipPath id="clip-section-mermaid-140-0"><rect width="988" height="25"/></clipPath><rect width="1000" height="400" class="treemapSection section0" fill="transparent" fill-opacity="0.6" stroke="transparent" stroke-width="2" stroke-opacity="0.4" style="display: none;"/><text class="treemapSectionLabel" x="6" y="12.5" dominant-baseline="middle" font-weight="bold" clip-path="url(#clip-section-mermaid-140-0)" style="display: none;"/><text class="treemapSectionValue" x="990" y="12.5" text-anchor="end" dominant-baseline="middle" font-style="italic" style="display: none;">70</text></g><g class="treemapSection" transform="translate(10,35)"><rect width="556" height="25" class="treemapSectionHeader" fill="none" fill-opacity="0.6" stroke-width="0.6" style=""/><clipPath id="clip-section-mermaid-140-1"><rect width="544" height="25"/></clipPath