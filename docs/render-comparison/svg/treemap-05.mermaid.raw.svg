<svg id="mermaid-141" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="2 27 996 371" style="max-width: 996px;" class="flowchart" role="graphics-document document" aria-roledescription="treemap"><style>#mermaid-141{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-141 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-141 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-141 .error-icon{fill:#a44141;}#mermaid-141 .error-text{fill:#ddd;stroke:#ddd;}#mermaid-141 .edge-thickness-normal{stroke-width:1px;}#mermaid-141 .edge-thickness-thick{stroke-width:3.5px;}#mermaid-141 .edge-pattern-solid{stroke-dasharray:0;}#mermaid-141 .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-141 .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-141 .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-141 .marker{fill:lightgrey;stroke:lightgrey;}#mermaid-141 .marker.cross{stroke:lightgrey;}#mermaid-141 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-141 p{margin:0;}#mermaid-141 .treemapNode.section{stroke:black;stroke-width:1;fill:#efefef;}#mermaid-141 .treemapNode.leaf{stroke:black;stroke-width:1;fill:#efefef;}#mermaid-141 .treemapLabel{fill:#ccc;font-size:12px;}#mermaid-141 .treemapValue{fill:#ccc;font-size:10px;}#mermaid-141 .treemapTitle{fill:#F9FFFE;font-size:14px;}#mermaid-141 .node .neo-node{stroke:#ccc;}#mermaid-141 [data-look="neo"].node rect,#mermaid-141 [data-look="neo"].cluster rect,#mermaid-141 [data-look="neo"].node polygon{stroke:url(#mermaid-141-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-141 [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-141 [data-look="neo"].node path{stro