finConfusion{stroke:lightgrey;stroke-width:1.5;stroke-dasharray:4 2;}#mermaid-118 .cynefinArrowLine{stroke:lightgrey;stroke-width:2;fill:none;}#mermaid-118 .cynefinArrowHead{fill:lightgrey;stroke:none;}#mermaid-118 .cynefinArrowLabel{font-size:11px;fill:#ccc;}#mermaid-118 .cynefinTitle{font-size:18px;font-weight:bold;fill:#e0dfdf;}#mermaid-118 .node .neo-node{stroke:#ccc;}#mermaid-118 [data-look="neo"].node rect,#mermaid-118 [data-look="neo"].cluster rect,#mermaid-118 [data-look="neo"].node polygon{stroke:url(#mermaid-118-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-118 [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-118 [data-look="neo"].node path{stroke:url(#mermaid-118-gradient);stroke-width:1px;}#mermaid-118 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-118 [data-look="neo"].node .neo-line path{stroke:#ccc;filter:none;}#mermaid-118 [data-look="neo"].node circle{stroke:url(#mermaid-118-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-118 [data-look="neo"].node circle .state-start{fill:#000000;}#mermaid-118 [data-look="neo"].icon-shape .icon{fill:url(#mermaid-118-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-118 [data-look="neo"].icon-shape .icon-neo path{stroke:url(#mermaid-118-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#mermaid-118 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(40, 40)"><g class="cynefin-backgrounds"><rect class="cynefinDomain" x="0" y="0" width="400" height="300" fill="#1B5E20" fill-opacity="0.4" stroke="none"/><rect class="cynefinDomain" x="400" y="0" width="400" height="300" fill="#0D47A1" fill-opacity="0.4" stroke="none"/><rect class="cynefinDomain" x="0" y="300" width="400" height="300" fill="#BF360C" fill-opacity="0.4" stroke="none"/><rect class="cynefinDomain" x="400" y="300" width="400" height="300" fill="#F57F17" fil